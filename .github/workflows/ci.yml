name: Hotel Revenue AI Agent CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-and-test:
    name: Backend Lint, Security & Unit/E2E Tests
    runs-on: ubuntu-latest

    services:
      sqlite:
        image: alpine
        ports:
          - "0:0"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Automated Test Orchestrator
        env:
          APP_MODE: DEMO
          DATABASE_URL: sqlite:///:memory:
          JWT_SECRET_KEY: ci-cd-pipeline-test-secret-key-32-chars-minimum
        run: |
          python scripts/run_tests.py --suite all --coverage

  frontend-build-and-lint:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Web Bundle
        working-directory: frontend
        run: npm run build

  docker-image-validation:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-build-and-lint]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./docker/backend.Dockerfile
          push: false
          tags: hotel-revenue-backend:ci

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./docker/frontend.Dockerfile
          push: false
          tags: hotel-revenue-frontend:ci
