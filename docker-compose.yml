version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: hotel_revenue_backend
    ports:
      - "8000:8000"
    environment:
      - APP_MODE=DEMO
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./data/hotel_revenue_demo.db
    volumes:
      - ./data:/app/data
      - ./rag/documents:/app/rag/documents
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: hotel_revenue_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
  chroma_data:
